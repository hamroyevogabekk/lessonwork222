<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
              background-color:  #F2EAE1;
        }


        .container{
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 20px;
        }


        .parts{
            display: flex;
            gap: 20px;
        }


        .first{
            text-align: center;
            width: 300px;
            height: 100vh;
        }

        .first img{
            border-radius: 50%;
        }

        .link{
            text-decoration: none;
            background-color: #FEAF00;
            color: #333;
            display: block;
            width: 100px;
            margin: 20px auto;
            padding: 10px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }


        .link:hover{
            transform: scale(1.1);
            background-color: #ffa600;
        }

        .link.active{
            background-color: #C47B00;
            transform: scale(0.95);
        }


        .log{
            position: relative;
            top: 340px;
            display: flex;
            justify-content: center;
            gap: 5px;
            color: black;
            text-decoration: none;
        }


        .second{
            width: 100%;
            padding: 20px;
            background-color: #F8F8F8;
        }


        .person{
            display: flex;
            gap: 30px;
            align-items: center;
            width: 500px;
            height: 350px;
            background-color: #ffffff;
            position: relative;
            top: 30px;
        }


        .twice{
            line-height: 1px;
            position: relative;
            left: 30px;
            bottom: 55px;
        }


        .las{
            opacity: 0.5;
        }

        .text{
            font-size: 18px;
        }

        .img{
            transition: all 0.3s ease;
        }



        .img:hover{
            transform: scale(1.2);
        }


        .profile-img{
            width: 180px;
            border-radius: 10px;
            position: relative;
            left: 30px;
            position: relative;
            bottom: 55px;
        }


       .third{
        position: relative;
        left: 80px;
        bottom: 100px;
       }




       .student{
           transition: all 0.3s ease;
       }



       .student:hover{
           transform: scale(1.1);
       }    
    </style>
</head>
<body>
    <div class="container">

                    <a class="log" href="part3.html">Log out<img width="15px" src="./out.svg" alt="">
                    </a>

            </div>

                    </div>

                    <div class="twice">
                       <p class="las">name</p>
                       <p class="text">karthi</p>
                       <p class="las">email</p>
                       <p class="text">karthi@gmail.com</p>
                       <p class="las">phone</p>
                       <p class="text">7305477760</p>
                       <p class="las">Date of admission</p>
                       <p class="text">08-Dec, 2021</p>
                    </div>


                    <div class="third">
                         <img class="vector" src="./Vector1.svg" alt="">
                    </div>
        
                </div>
            </div>
    </div>
